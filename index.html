function renderChapter(i){
  const ch = CHAPTERS[i];
  const v = $('#v-chapter');
  v.textContent = '';
  const top = make('div', 'g-top');
  const back = make('a', 'back');
  back.href = '#story';
  back.innerHTML = ICONS.left + 'Our story';
  top.appendChild(back);
  v.appendChild(top);
  v.appendChild(make('p', 'g-chapter', 'Chapter ' + NUMBER_WORDS[i]));
  v.appendChild(make('h1', 'g-title', ch.title || ''));
  v.appendChild(make('p', 'g-how', HOW[ch.type] || ''));
  const game = make('div', 'game');
  v.appendChild(game);
  show('chapter');

  const finish = won => {
    progress.done[i] = true;
    saveProgress();
    showMemory(i, won ? 'won' : 'lost');
  };
  const games = { wordle:playWordle, connections:playConnections, crossword:playCrossword };
  if(games[ch.type]) games[ch.type](game, ch, finish);
  else game.appendChild(make('p', 'g-how', 'This chapter type isn’t recognised. Use wordle, connections or crossword.'));
}

/* ---------------- on-screen keyboard ---------------- */
function buildKeyboard(withEnter, onKey){
  const wrap = make('div', 'kb');
  const keys = {};
  const rows = [
    'QWERTYUIOP'.split(''),
    'ASDFGHJKL'.split(''),
    (withEnter ? ['ENTER'] : []).concat('ZXCVBNM'.split(''), ['DEL'])
  ];
  rows.forEach(r => {
    const row = make('div', 'kb-row');
    r.forEach(k => {
      const b = make('button', 'key' + (k.length > 1 ? ' wide' : ''), k === 'DEL' ? 'Delete' : k === 'ENTER' ? 'Enter' : k);
      b.type = 'button';
      if(k === 'DEL') b.setAttribute('aria-label', 'Delete letter');
      b.addEventListener('click', () => onKey(k));
      row.appendChild(b);
      keys[k] = b;
    });
    wrap.appendChild(row);
  });
  return { el:wrap, keys };
}

/* ---------------- chapter type: word game ---------------- */
function playWordle(root, ch, finish){
  const answer = clean(ch.answer);
  const LEN = answer.length, ROWS = 6;
  const sheet = make('div', 'sheet game-sheet');
  if(ch.hint) sheet.appendChild(make('p', 'hint hand', ch.hint));
  const board = make('div', 'w-board');
  board.style.setProperty('--len', LEN);
  const rows = [];
  for(let r = 0; r < ROWS; r++){
    const row = make('div', 'w-row');
    const cells = [];
    for(let c = 0; c < LEN; c++){
      const cell = make('div', 'w-cell');
      row.appendChild(cell);
      cells.push(cell);
    }
    board.appendChild(row);
    rows.push({ row, cells });
  }
  sheet.appendChild(board);
  board.setAttribute('aria-label', LEN + ' letter word, ' + ROWS + ' tries');
  const kb = buildKeyboard(true, handle);
  root.append(sheet, kb.el);

  function size(){
    const byWidth = Math.floor((sheet.clientWidth - 32 - (LEN - 1) * 6) / LEN);
    const top = board.getBoundingClientRect().top + window.scrollY;
    const below = 22 + 18 + kb.el.offsetHeight + 16;
    const byHeight = Math.floor((window.innerHeight - top - below - (ROWS - 1) * 6) / ROWS);
    const t = Math.max(34, Math.min(58, byWidth, byHeight));
    board.style.setProperty('--tile', t + 'px');
  }
  size();
  setResize(size);

  let guesses = 0, current = '', over = false, busy = false;
  const RANK = { absent:0, present:1, correct:2 };

  function paintCurrent(){
    const { cells } = rows[guesses];
    cells.forEach((cell, i) => {
      cell.textContent = current[i] || '';
      cell.classList.toggle('filled', i < current.length);
    });
  }

  function handle(k){
    if(over || busy) return;
    if(k === 'ENTER') return submit();
    if(k === 'DEL'){
      if(current){ current = current.slice(0, -1); paintCurrent(); haptic(6); }
      return;
    }
    if(/^[A-Z]$/.test(k) && current.length < LEN){
      current += k;
      paintCurrent();
      const cell = rows[guesses].cells[current.length - 1];
      cell.classList.remove('pop'); void cell.offsetWidth; cell.classList.add('pop');
      sound.tap(); haptic(5);
    }
  }

  function score(guess){
    const res = Array(LEN).fill('absent');
    const pool = answer.split('');
    for(let i = 0; i < LEN; i++) if(guess[i] === answer[i]){ res[i] = 'correct'; pool[i] = null; }
    for(let i = 0; i < LEN; i++){
      if(res[i] === 'correct') continue;
      const j = pool.indexOf(guess[i]);
      if(j > -1){ res[i] = 'present'; pool[j] = null; }
    }
    return res;
  }

  function submit(){
    if(current.length < LEN){
      toast('Not enough letters');
      sound.wrong(); haptic(20);
      const r = rows[guesses].row;
      r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake');
      return;
    }
    busy = true;
    const guess = current, res = score(guess), { cells, row } = rows[guesses];
    res.forEach((state, i) => {
      later(() => {
        cells[i].classList.add('flip');
        later(() => {
          cells[i].classList.add(state);
          sound.reveal(state);
          const key = kb.keys[guess[i]];
          if(key){
            const cur = key.dataset.state;
            if(!cur || RANK[state] > RANK[cur]){
              key.classList.remove('absent', 'present', 'correct');
              key.classList.add(state);
              key.dataset.state = state;
            }
          }
        }, 250);
      }, i * 230);
    });
    guesses++; current = '';
    const settle = LEN * 230 + 400;
    if(guess === answer){
      over = true;
      later(() => { sound.chime(); haptic([12, 40, 12]); heartBurst(28); sparkAt(row, 26); }, settle);
      later(() => finish(true), settle + 1100);
    } else if(guesses === ROWS){
      over = true;
      later(() => toast('The word was ' + answer, 2200), settle);
      later(() => finish(false), settle + 2000);
    } else {
      later(() => { busy = false; }, settle - 150);
    }
  }

  setKeys(e => {
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(e.key === 'Enter'){ e.preventDefault(); handle('ENTER'); }
    else if(e.key === 'Backspace'){ e.preventDefault(); handle('DEL'); }
    else if(/^[a-z]$/i.test(e.key)) handle(e.key.toUpperCase());
  });
}

/* ---------------- chapter type: groups game ---------------- */
function playConnections(root, ch, finish){
  const groups = (ch.groups || []).slice(0, 4).map((g, gi) => ({
    name: g.name || '',
    words: (g.words || []).slice(0, 4).map(w => String(w).toUpperCase().trim()),
    gi
  }));
  const items = [];
  groups.forEach(g => g.words.forEach(w => items.push({ word:w, g:g.gi })));
  const MAX = 4;
  let order = shuffle(items.map((_, i) => i));
  let selected = [], solved = [], mistakes = 0, locked = false;
  const tried = new Set();

  const sheet = make('div', 'sheet game-sheet');
  const solvedEl = make('div', 'c-solved');
  const grid = make('div', 'c-grid');
  const lives = make('p', 'c-lives');
  sheet.append(solvedEl, grid, lives);
  const controls = make('div', 'btn-row');
  const shuffleBtn = make('button', 'btn btn-ghost', 'Shuffle');
  const clearBtn = make('button', 'btn btn-ghost', 'Deselect all');
  const submitBtn = make('button', 'btn btn-wax', 'Submit');
  [shuffleBtn, clearBtn, submitBtn].forEach(b => { b.type = 'button'; controls.appendChild(b); });
  submitBtn.style.padding = '10px 22px';
  submitBtn.style.fontSize = '14px';
  root.append(sheet, controls);

  function shuffle(a){
    a = a.slice();
    for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  function renderSolved(){
    solvedEl.textContent = '';
    solved.forEach(gi => {
      const g = groups[gi];
      const bar = make('div', 'c-group g' + gi);
      bar.appendChild(make('b', null, g.name));
      bar.appendChild(make('span', null, g.words.join(', ')));
      solvedEl.appendChild(bar);
    });
  }

  function render(){
    grid.textContent = '';
    order.filter(idx => !solved.includes(items[idx].g)).forEach(idx => {
      const w = items[idx].word;
      const b = make('button', 'c-cell' + (w.length > 9 ? ' xs' : w.length > 6 ? ' sm' : ''), w);
      b.type = 'button';
      b.dataset.idx = idx;
      if(selected.includes(idx)){ b.classList.add('sel'); b.setAttribute('aria-pressed', 'true'); }
      else b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => toggle(idx));
      grid.appendChild(b);
    });
    lives.innerHTML = 'Mistakes left ';
    for(let i = 0; i < MAX; i++){
      const s = make('span', i < MAX - mistakes ? '' : 'lost');
      s.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#B81D3A" d="' + HEART_PATH + '"/></svg>';
      lives.appendChild(s);
    }
    lives.setAttribute('aria-label', (MAX - mistakes) + ' mistakes left');
    submitBtn.disabled = selected.length !== 4 || locked;
    submitBtn.style.opacity = submitBtn.disabled ? .45 : 1;
    clearBtn.disabled = !selected.length;
  }

  function toggle(idx){
    if(locked) return;
    if(selected.includes(idx)) selected = selected.filter(x => x !== idx);
    else if(selected.length < 4) selected.push(idx);
    else return;
    sound.tap(); haptic(5);
    render();
  }

  function submit(){
    if(selected.length !== 4 || locked) return;
    const sig = selected.slice().sort((a, b) => a - b).join(',');
    if(tried.has(sig)){ toast('Already guessed'); return; }
    tried.add(sig);
    const gs = selected.map(idx => items[idx].g);
    if(gs.every(g => g === gs[0])){
      solved.push(gs[0]);
      selected = [];
      sound.chime(); haptic([10, 30, 10]);
      renderSolved(); render();
      sparkAt(solvedEl.lastElementChild, 16);
      if(solved.length === groups.length){
        locked = true; render();
        later(() => heartBurst(28), 300);
        later(() => finish(true), 1500);
      }
      return;
    }
    const counts = {};
    gs.forEach(g => { counts[g] = (counts[g] || 0) + 1; });
    const oneAway = Math.max(...Object.values(counts)) === 3;
    mistakes++;
    sound.wrong(); haptic(20);
    locked = true;
    grid.querySelectorAll('.c-cell.sel').forEach(c => c.classList.add('shake'));
    later(() => {
      locked = false;
      if(oneAway && mistakes < MAX) toast('One away…');
      if(mistakes >= MAX){
        locked = true;
        selected = [];
        toast('Out of mistakes. Here are the groups.', 2000);
        const left = groups.map(g => g.gi).filter(gi => !solved.includes(gi));
        left.forEach((gi, n) => later(() => { solved.push(gi); renderSolved(); render(); }, 500 + n * 550));
        later(() => finish(false), 900 + left.length * 550 + 1200);
      }
      render();
    }, 450);
  }

  shuffleBtn.addEventListener('click', () => { order = shuffle(order); render(); });
  clearBtn.addEventListener('click', () => { selected = []; render(); });
  submitBtn.addEventListener('click', submit);
  setKeys(e => { if(e.key === 'Enter' && !(e.target instanceof HTMLButtonElement)) submit(); });
  render();
}

/* ---------------- crossword layout (automatic) ----------------
   Tries many word orders and keeps the most compact connected grid,
   favouring wide-and-short shapes that suit a phone. A fixed seed
   means the same word list always produces the same grid. */
function buildCrossword(list){
  const base = (list || [])
    .map((w, i) => ({ answer:clean(w.answer), clue:w.clue || '', i }))
    .filter(w => w.answer.length >= 2);
  if(!base.length) return { R:0, C:0, entries:[], grid:new Map(), numAt:{} };
  const K = (r, c) => r + ',' + c;

  function layout(order){
    const cells = new Map(), placed = [];
    const fits = (word, r, c, dir) => {
      const dr = dir === 'D' ? 1 : 0, dc = dir === 'A' ? 1 : 0;
      if(cells.has(K(r - dr, c - dc)) || cells.has(K(r + dr * word.length, c + dc * word.length))) return -1;
      let cross = 0;
      for(let i = 0; i < word.length; i++){
        const rr = r + dr * i, cc = c + dc * i, cell = cells.get(K(rr, cc));
        if(cell){
          if(cell.ch !== word[i] || cell[dir]) return -1;
          cross++;
        } else if(dir === 'A'){
          if(cells.has(K(rr - 1, cc)) || cells.has(K(rr + 1, cc))) return -1;
        } else if(cells.has(K(rr, cc - 1)) || cells.has(K(rr, cc + 1))) return -1;
      }
      return cross;
    };
    const bounds = extra => {
      let r0 = Infinity, r1 = -Infinity, c0 = Infinity, c1 = -Infinity;
      const add = (r, c) => { if(r < r0) r0 = r; if(r > r1) r1 = r; if(c < c0) c0 = c; if(c > c1) c1 = c; };
      cells.forEach((_, k) => { const [r, c] = k.split(',').map(Number); add(r, c); });
      if(extra) for(let i = 0; i < extra.len; i++) add(extra.r + (extra.dir === 'D' ? i : 0), extra.c + (extra.dir === 'A' ? i : 0));
      return { r0, r1, c0, c1 };
    };
    const put = (w, r, c, dir) => {
      for(let i = 0; i < w.answer.length; i++){
        const k = K(r + (dir === 'D' ? i : 0), c + (dir === 'A' ? i : 0));
        const cell = cells.get(k) || { ch:w.answer[i] };
        cell[dir] = true;
        cells.set(k, cell);
      }
      placed.push({ answer:w.answer, clue:w.clue, r, c, dir });
    };
    const tryPlace = w => {
      let best = null;
      cells.forEach((cell, k) => {
        const [r0, c0] = k.split(',').map(Number);
        for(let i = 0; i < w.answer.length; i++){
          if(w.answer[i] !== cell.ch) continue;
          for(const dir of ['A', 'D']){
            if(cell[dir]) continue;
            const r = dir === 'D' ? r0 - i : r0, c = dir === 'A' ? c0 - i : c0;
            const cross = fits(w.answer, r, c, dir);
            if(cross < 1) continue;
            const b = bounds({ r, c, dir, len:w.answer.length });
            const h = b.r1 - b.r0 + 1, wd = b.c1 - b.c0 + 1;
            const sc = cross * 100 - h * wd - Math.max(0, h - wd) * 10 - Math.max(0, wd - 10) * 60;
            if(!best || sc > best.sc) best = { r, c, dir, sc };
          }
        }
      });
      if(best){ put(w, best.r, best.c, best.dir); return true; }
      return false;
    };

    put(order[0], 0, 0, 'A');
    let waiting = [];
    order.slice(1).forEach(w => { if(!tryPlace(w)) waiting.push(w); });
    for(let pass = 0; pass < 2 && waiting.length; pass++) waiting = waiting.filter(w => !tryPlace(w));
    const loose = waiting.length;
    waiting.forEach(w => { const b = bounds(); put(w, b.r1 + 2, b.c0, 'A'); });

    const b = bounds();
    const h = b.r1 - b.r0 + 1, wd = b.c1 - b.c0 + 1;
    let crossings = 0;
    cells.forEach(cell => { if(cell.A && cell.D) crossings++; });
    const score = -loose * 10000 + crossings * 40 - h * wd - Math.max(0, h - wd) * 14 - Math.max(0, wd - 10) * 80;
    return { cells, placed, b, h, wd, score, loose, waiting };
  }

  let seed = 20260214;
  const rand = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
  const byLength = base.slice().sort((a, b) => b.answer.length - a.answer.length || a.i - b.i);
  const orders = [byLength];
  byLength.forEach(w => orders.push([w].concat(byLength.filter(x => x !== w))));
  for(let t = 0; t < 60; t++){
    const o = byLength.slice();
    for(let i = o.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [o[i], o[j]] = [o[j], o[i]]; }
    orders.push(o);
  }
  let best = null;
  orders.forEach(o => { const lay = layout(o); if(!best || lay.score > best.score) best = lay; });

  const { cells, placed, b } = best;
  const grid = new Map();
  cells.forEach((cell, k) => { const [r, c] = k.split(',').map(Number); grid.set(K(r - b.r0, c - b.c0), cell.ch); });
  placed.forEach(p => { p.r -= b.r0; p.c -= b.c0; });

  const starts = [...new Set(placed.map(p => K(p.r, p.c)))]
    .map(k => k.split(',').map(Number))
    .sort((x, y) => x[0] - y[0] || x[1] - y[1]);
  const numAt = {};
  starts.forEach(([r, c], n) => { numAt[K(r, c)] = n + 1; });
  const entries = placed.map(p => ({
    num:numAt[K(p.r, p.c)], dir:p.dir, answer:p.answer, clue:p.clue,
    cells:Array.from({ length:p.answer.length }, (_, i) => [p.r + (p.dir === 'D' ? i : 0), p.c + (p.dir === 'A' ? i : 0)])
  })).sort((x, y) => x.num - y.num || (x.dir === 'A' ? -1 : 1));
  if(best.loose && window.console) console.warn('Our Story crossword: no shared letters for ' + best.waiting.map(w => w.answer).join(', ') + ', so placed separately. Try swapping a word.');
  return { R:best.h, C:best.wd, entries, grid, numAt };
}

/* ---------------- chapter type: crossword ---------------- */
function playCrossword(root, ch, finish){
  const xw = buildCrossword(ch.words);
  const K = (r, c) => r + ',' + c;
  if(!xw.entries.length){ root.appendChild(make('p', 'g-how', 'Add some words to this crossword.')); return; }

  const sheet = make('div', 'sheet game-sheet');
  const board = make('div', 'xw-board');
  board.style.gridTemplateColumns = 'repeat(' + xw.C + ', var(--cell))';
  const cellEls = {};
  for(let r = 0; r < xw.R; r++){
    for(let c = 0; c < xw.C; c++){
      const k = K(r, c);
      const cell = make('div', 'xw-cell');
      if(!xw.grid.has(k)){ cell.classList.add('void'); board.appendChild(cell); continue; }
      if(xw.numAt[k]) cell.appendChild(make('span', 'xw-num', xw.numAt[k]));
      const letter = make('span', 'xw-letter');
      cell.appendChild(letter);
      cell.addEventListener('click', () => tapCell(r, c));
      board.appendChild(cell);
      cellEls[k] = { cell, letter };
    }
  }
  const clueBar = make('div', 'xw-clue');
  const prev = make('button', 'xw-arrow'); prev.type = 'button'; prev.innerHTML = ICONS.left; prev.setAttribute('aria-label', 'Previous clue');
  const clueText = make('p');
  clueText.setAttribute('aria-live', 'polite');
  const next = make('button', 'xw-arrow'); next.type = 'button'; next.innerHTML = ICONS.right; next.setAttribute('aria-label', 'Next clue');
  clueBar.append(prev, clueText, next);
  sheet.append(board, clueBar);
  const kb = buildKeyboard(false, onKey);
  const tools = make('div', 'btn-row');
  const checkBtn = make('button', 'btn btn-ghost', 'Check letters');
  const revealBtn = make('button', 'btn btn-ghost', 'Reveal this word');
  checkBtn.type = revealBtn.type = 'button';
  tools.append(checkBtn, revealBtn);
  root.append(sheet, kb.el, tools);

  function size(){
    const byWidth = Math.floor((sheet.clientWidth - 32 - (xw.C - 1) * 3) / xw.C);
    const top = board.getBoundingClientRect().top + window.scrollY;
    const below = clueBar.offsetHeight + 18 + 22 + kb.el.offsetHeight + 18 + 16;
    const byHeight = Math.floor((window.innerHeight - top - below - (xw.R - 1) * 3) / xw.R);
    const s = Math.max(24, Math.min(44, byWidth, byHeight));
    board.style.setProperty('--cell', s + 'px');
  }
  size();
  setResize(size);

  const letters = {};
  let entry = xw.entries[0], pos = entry.cells[0], over = false, nudged = false;
  const entriesAt = (r, c) => xw.entries.filter(e => e.cells.some(([a, b]) => a === r && b === c));
  const idxInEntry = () => entry.cells.findIndex(([a, b]) => a === pos[0] && b === pos[1]);

  function paint(){
    Object.values(cellEls).forEach(({ cell }) => cell.classList.remove('word', 'here'));
    if(!over){
      entry.cells.forEach(([r, c]) => cellEls[K(r, c)].cell.classList.add('word'));
      cellEls[K(pos[0], pos[1])].cell.classList.add('here');
    }
    Object.entries(cellEls).forEach(([k, { letter }]) => { letter.textContent = letters[k] || ''; });
    clueText.innerHTML = '';
    clueText.appendChild(make('b', null, entry.num + ' ' + (entry.dir === 'A' ? 'Across' : 'Down')));
    clueText.appendChild(document.createTextNode(entry.clue));
  }

  function tapCell(r, c){
    if(over) return;
    const here = entriesAt(r, c);
    if(!here.length) return;
    if(pos[0] === r && pos[1] === c && here.length > 1) entry = here.find(e => e !== entry) || here[0];
    else if(!here.includes(entry)) entry = here.find(e => e.dir === entry.dir) || here[0];
    pos = [r, c];
    haptic(5);
    paint();
  }

  function step(delta){
    const i = idxInEntry() + delta;
    if(i >= 0 && i < entry.cells.length) pos = entry.cells[i];
  }
  function gotoEntry(delta){
    const i = xw.entries.indexOf(entry);
    entry = xw.entries[(i + delta + xw.entries.length) % xw.entries.length];
    const empty = entry.cells.find(([r, c]) => !letters[K(r, c)]);
    pos = empty || entry.cells[0];
    paint();
  }

  function onKey(k){
    if(over) return;
    const key = K(pos[0], pos[1]);
    if(k === 'DEL'){
      if(letters[key]) letters[key] = '';
      else { step(-1); letters[K(pos[0], pos[1])] = ''; }
      cellEls[K(pos[0], pos[1])].cell.classList.remove('wrong', 'revealed');
      haptic(5);
      paint();
      return;
    }
    if(!/^[A-Z]$/.test(k)) return;
    letters[key] = k;
    cellEls[key].cell.classList.remove('wrong', 'revealed');
    sound.tap(); haptic(5);
    if(idxInEntry() === entry.cells.length - 1){
      const wordFull = entry.cells.every(([r, c]) => letters[K(r, c)]);
      if(wordFull){
        const nextOpen = xw.entries.slice(xw.entries.indexOf(entry) + 1).concat(xw.entries)
          .find(e => e.cells.some(([r, c]) => !letters[K(r, c)]));
        if(nextOpen){ entry = nextOpen; pos = entry.cells.find(([r, c]) => !letters[K(r, c)]); }
      }
    } else step(1);
    paint();
    checkComplete();
  }

  function checkComplete(){
    const keys = [...xw.grid.keys()];
    if(!keys.every(k => letters[k])) return;
    if(keys.every(k => letters[k] === xw.grid.get(k))){
      over = true;
      paint();
      keys.sort((a, b) => { const [r1, c1] = a.split(',').map(Number), [r2, c2] = b.split(',').map(Number); return (r1 + c1) - (r2 + c2); })
        .forEach((k, n) => later(() => cellEls[k].cell.classList.add('solved'), n * 35));
      later(() => { sound.chime(); haptic([12, 40, 12]); heartBurst(28); sparkAt(board, 28); }, keys.length * 35 + 200);
      later(() => finish(true), keys.length * 35 + 1400);
    } else if(!nudged){
      nudged = true;
      toast('Nearly. A few letters aren’t right yet.', 2000);
    }
  }

  checkBtn.addEventListener('click', () => {
    if(over) return;
    let wrong = 0;
    Object.keys(letters).forEach(k => {
      if(letters[k] && letters[k] !== xw.grid.get(k)){ cellEls[k].cell.classList.add('wrong'); wrong++; }
    });
    if(wrong){ toast(wrong === 1 ? '1 letter isn’t right' : wrong + ' letters aren’t right'); sound.wrong(); }
    else toast('Everything so far is right');
  });
  revealBtn.addEventListener('click', () => {
    if(over) return;
    entry.cells.forEach(([r, c], i) => {
      const k = K(r, c);
      if(letters[k] !== entry.answer[i]){ letters[k] = entry.answer[i]; cellEls[k].cell.classList.add('revealed'); }
      cellEls[k].cell.classList.remove('wrong');
    });
    paint();
    checkComplete();
  });
  prev.addEventListener('click', () => gotoEntry(-1));
  next.addEventListener('click', () => gotoEntry(1));

  setKeys(e => {
    if(e.metaKey || e.ctrlKey || e.altKey) return;
    if(/^[a-z]$/i.test(e.key)) onKey(e.key.toUpperCase());
    else if(e.key === 'Backspace'){ e.preventDefault(); onKey('DEL'); }
    else if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){ e.preventDefault(); step(1); paint(); }
    else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){ e.preventDefault(); step(-1); paint(); }
    else if(e.key === 'Tab'){ e.preventDefault(); gotoEntry(e.shiftKey ? -1 : 1); }
  });
  paint();
}

/* ---------------- keepsake ---------------- */
let memoryReturnFocus = null;
function showMemory(i, mode){
  const ch = CHAPTERS[i], m = ch.memory || {};
  memoryReturnFocus = document.activeElement;
  $('#memoryKicker').textContent =
    mode === 'lost' ? 'Not quite, but here’s the memory' :
    mode === 'reread' ? 'Chapter ' + NUMBER_WORDS[i] :
    'Chapter ' + NUMBER_WORDS[i] + ' solved';
  const pic = $('#memoryPic');
  pic.textContent = '';
  const fallback = () => {
    pic.textContent = '';
    if(ch.type === 'wordle') pic.appendChild(make('span', 'pol-word', clean(ch.answer)));
    else pic.innerHTML = ICONS.bigHeartLine;
  };
  if(m.photo){
    const img = photoImg(m);
    img.alt = m.title || '';
    img.onerror = fallback;
    pic.appendChild(img);
  } else fallback();
  $('#memoryCaption').textContent = m.title || ch.title || '';
  const note = $('#memoryNote');
  note.textContent = m.note || '';
  note.style.display = m.note ? '' : 'none';

  const btn = $('#memoryBtn');
  if(mode === 'reread'){ btn.textContent = 'Close'; btn.onclick = hideMemory; }
  else if(allDone()){ btn.textContent = 'Turn to the last page'; btn.onclick = () => { location.hash = 'last-page'; }; }
  else { btn.textContent = 'Continue our story'; btn.onclick = () => { location.hash = 'story'; }; }

  const o = $('#memory');
  o.classList.remove('show'); void o.offsetWidth;
  o.classList.add('show');
  document.body.style.overflow = 'hidden';
  if(mode !== 'reread'){ later(() => { sparkAt($('#memory .polaroid'), 22); sound.sparkle(); }, 650); }
  setTimeout(() => btn.focus({ preventScroll:true }), 50);
}
function hideMemory(){
  const o = $('#memory');
  if(!o.classList.contains('show')) return;
  o.classList.remove('show');
  document.body.style.overflow = '';
  if(memoryReturnFocus && document.contains(memoryReturnFocus)) memoryReturnFocus.focus({ preventScroll:true });
}
$('#memory').addEventListener('click', e => {
  if(e.target.id === 'memory' && $('#memoryBtn').textContent === 'Close') hideMemory();
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('#memory').classList.contains('show') && $('#memoryBtn').textContent === 'Close') hideMemory();
});

/* ---------------- last page ---------------- */
const ask = STORY.ask || {};
const NO_LINES = ['Are you sure?', 'Think again', 'Wrong button', 'Nice try', 'Not an option'];
let noTries = 0, writing = null;

function renderLast(){
  const intro = $('#finalIntro'), stage = $('#finalStage');
  noTries = 0;
  if(progress.answered){
    intro.hidden = true; stage.hidden = false;
    show('last');
    buildLetter(false);
    $('#ask').classList.add('gone');
    showAnswered(false);
    return;
  }
  intro.hidden = false; stage.hidden = true;
  const slot = $('#finalEnvSlot');
  slot.textContent = '';
  const env = makeEnvelope({ aria:'Open your last letter', peek:'The last page', label:'One last thing', heart:true });
  env.classList.add('glow');
  env.addEventListener('click', () => openEnvelope(env, startLetter));
  slot.appendChild(env);
  show('last');
}

function startLetter(){
  $('#finalIntro').hidden = true;
  $('#finalStage').hidden = false;
  window.scrollTo(0, 0);
  buildLetter(!reduceMotion());
}

// writes the letter onto lined paper, one handwritten line at a time
function buildLetter(animate){
  const letter = $('#lastLetter');
  $('#lastTo').textContent = STORY.to + ',';
  const body = $('#lastBody');
  body.textContent = '';
  String(STORY.letter || '').trim().split(/\n\s*\n/).forEach(block => {
    const p = make('p');
    block.split('\n').forEach((line, li) => {
      if(li) p.appendChild(document.createElement('br'));
      line.trim().split(/\s+/).forEach((w, wi, arr) => {
        p.appendChild(make('span', 'w', w));
        if(wi < arr.length - 1) p.appendChild(document.createTextNode(' '));
      });
    });
    body.appendChild(p);
  });
  const from = $('#lastFrom');
  from.textContent = '';
  from.appendChild(make('span', 'ln', STORY.signOff || ''));
  from.appendChild(make('span', 'ln', STORY.from));

  $('#askQ').textContent = ask.question || 'Will you be my Valentine?';
  $('#askYes').textContent = ask.yes || 'Yes';
  const no = $('#askNo');
  no.textContent = ask.no || 'No';
  no.classList.remove('loose');
  no.style.cssText = '';
  $('#askYes').style.transform = '';
  $('#ask').classList.remove('in', 'gone');
  $('#answered').classList.remove('in');
  $('#skipHint').style.opacity = animate ? 1 : 0;

  // shown straight away (e.g. a return visit): let the browser lay the lines out itself
  if(!animate){
    letter.classList.remove('writing');
    if(!progress.answered) revealAsk();
    return;
  }

  // group words into the lines the browser drew, so each line can be written in turn
  const lines = [];
  const salute = $('#lastTo');
  salute.classList.add('ln');
  lines.push(salute);
  body.querySelectorAll('p').forEach(p => {
    const groups = [];
    let top = null;
    p.querySelectorAll('.w').forEach(w => {
      if(top === null || Math.abs(w.offsetTop - top) > 4){ groups.push([]); top = w.offsetTop; }
      groups[groups.length - 1].push(w.textContent);
    });
    p.textContent = '';
    groups.forEach(g => { const ln = make('span', 'ln', g.join(' ')); p.appendChild(ln); lines.push(ln); });
  });
  from.querySelectorAll('.ln').forEach(l => lines.push(l));

  letter.classList.add('writing');
  let t = 500;
  const marks = [];
  lines.forEach((ln, n) => {
    const chars = ln.textContent.length;
    const dur = Math.max(260, chars * 30);
    ln.style.transitionDuration = dur + 'ms';
    marks.push(later(() => ln.classList.add('on'), t));
    const newPara = ln.parentElement !== (lines[n + 1] && lines[n + 1].parentElement);
    t += dur + (newPara ? 420 : 90);
  });
  const done = later(finishWriting, t + 200);
  writing = { marks:marks.concat(done) };
  letter.onclick = () => { if(writing) finishWriting(); };
}
function finishWriting(){
  if(!writing) return;
  writing.marks.forEach(clearTimeout);
  writing = null;
  const letter = $('#lastLetter');
  letter.querySelectorAll('.ln').forEach(l => l.classList.add('on'));
  setTimeout(() => letter.classList.remove('writing'), 50);
  $('#skipHint').style.opacity = 0;
  letter.onclick = null;
  later(revealAsk, 500);
}
function revealAsk(){
  if(ask.enabled === false){ showAnswered(true); return; }
  const a = $('#ask');
  a.classList.add('in');
  later(() => {
    if(a.getBoundingClientRect().bottom > window.innerHeight) a.scrollIntoView({ behavior:reduceMotion() ? 'auto' : 'smooth', block:'center' });
  }, 200);
}

function dodge(){
  const no = $('#askNo'), area = $('#askBtns'), yes = $('#askYes');
  noTries++;
  haptic(10);
  yes.style.transform = 'scale(' + Math.min(1 + noTries * .14, 1.7) + ')';
  if(noTries > NO_LINES.length){
    no.style.opacity = '0';
    no.style.pointerEvents = 'none';
    later(() => { no.style.display = 'none'; }, 300);
    yes.focus({ preventScroll:true });
    return;
  }
  no.textContent = NO_LINES[noTries - 1];
  const aw = area.clientWidth, ah = area.clientHeight;
  no.classList.add('loose');
  no.classList.remove('wobble'); void no.offsetWidth; no.classList.add('wobble');
  const bw = no.offsetWidth, bh = no.offsetHeight;
  const yr = yes.getBoundingClientRect(), ar = area.getBoundingClientRect();
  const yBox = { l:yr.left - ar.left - 12, t:yr.top - ar.top - 12, r:yr.right - ar.left + 12, b:yr.bottom - ar.top + 12 };
  let x = 0, y = 0;
  for(let t = 0; t < 30; t++){
    x = Math.random() * Math.max(0, aw - bw);
    y = Math.random() * Math.max(0, ah - bh);
    if(x + bw < yBox.l || x > yBox.r || y + bh < yBox.t || y > yBox.b) break;
  }
  no.style.left = x + 'px';
  no.style.top = y + 'px';
}
$('#askNo').addEventListener('pointerenter', e => { if(e.pointerType === 'mouse') dodge(); });
$('#askNo').addEventListener('pointerdown', e => { if(e.pointerType !== 'mouse'){ e.preventDefault(); dodge(); } });
$('#askNo').addEventListener('click', e => { e.preventDefault(); dodge(); });

$('#askYes').addEventListener('click', () => {
  const yes = $('#askYes');
  progress.answered = true;
  saveProgress();
  sound.chime(); later(sound.sparkle, 300);
  haptic([15, 40, 15, 40, 25]);
  sparkAt(yes, 40);
  heartBurst(70);
  later(() => heartBurst(40), 900);
  $('#ask').classList.add('gone');
  showAnswered(true);
});

// the three memories land as a little collage
function showAnswered(animate){
  const col = $('#collage');
  col.textContent = '';
  const n = CHAPTERS.length;
  const tilts = [-8, 5, -3, 7, -6];
  const ys = [16, 0, 30, 6, 22];
  CHAPTERS.forEach((ch, i) => {
    const m = ch.memory || {};
    const pol = make('span', 'pol');
    const x = n === 1 ? 28 : 3 + i * (50 / (n - 1));
    pol.style.setProperty('--x', x + '%');
    pol.style.setProperty('--y', ys[i % ys.length] + 'px');
    pol.style.setProperty('--tilt', tilts[i % tilts.length] + 'deg');
    pol.style.setProperty('--d', (animate ? .25 + i * .22 : 0) + 's');
    pol.style.zIndex = i === 1 ? 3 : 2;
    const pic = make('span', 'pol-pic');
    if(m.photo){
      const img = photoImg(m);
      img.onerror = () => { img.remove(); pic.appendChild(illustration(ch, true)); };
      pic.appendChild(img);
    } else pic.appendChild(illustration(ch, true));
    pol.appendChild(pic);
    const cap = make('span', 'pol-cap');
    cap.appendChild(make('span', 'pol-title', m.title || ch.title));
    pol.appendChild(cap);
    col.appendChild(pol);
  });
  if(!n) col.style.display = 'none';
  $('#answeredMsg').textContent = ask.afterYes || '';
  $('#theEnd').textContent = STORY.ending || '';
  const share = $('#shareBtn');
  share.textContent = 'Send ' + STORY.from + ' your answer';
  share.style.display = ask.enabled === false ? 'none' : '';
  const a = $('#answered');
  if(!animate) a.style.setProperty('--d', '0s');
  a.classList.remove('in'); void a.offsetWidth;
  a.classList.toggle('still', !animate);
  a.classList.add('in');
  if(animate) later(() => a.scrollIntoView({ behavior:reduceMotion() ? 'auto' : 'smooth', block:'start' }), 150);
}

$('#shareBtn').addEventListener('click', async () => {
  const text = STORY.shareText || 'Yes ♥';
  if(navigator.share){
    try{ await navigator.share({ text }); return; }
    catch(e){ if(e && e.name === 'AbortError') return; }
  }
  window.open('https://wa.me/?text=' + encodeURIComponent(text), '_blank', 'noopener');
});

route();
})();
</script>
